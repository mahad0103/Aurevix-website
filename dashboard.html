<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurevix Content Dashboard</title><link rel="stylesheet" href="styles.css"></head><body><main class="admin-dashboard"><div class="admin-top"><div class="brand"><span class="brand-mark">A</span><span>AUREVIX<small>CONTENT CONTROL</small></span></div><a href="index.html">View website ↗</a></div><h1>Blog dashboard</h1><p class="small-copy">Create, publish and remove blog articles. Only authenticated users with the admin role can write.</p><div id="dashboard-status" class="status">Checking your session…</div><section id="dashboard-content" class="hidden"><div class="admin-panel"><h2>Write a new article</h2><form id="post-form"><label>Title<input id="post-title" required maxlength="140"></label><label>Category<input id="post-category" required placeholder="Technology, Education, Motivation"></label><label>Short summary<textarea id="post-summary" rows="2" required maxlength="300"></textarea></label><label>Article content<textarea id="post-content" rows="9" required></textarea></label><label><input id="post-published" type="checkbox" checked style="width:auto"> Publish immediately</label><button class="btn btn-primary" type="submit">Save article ↗</button></form></div><div class="admin-panel"><h2>Your articles</h2><div id="posts-list"></div></div><button class="btn btn-ghost" id="logout">Sign out</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-config.js"></script><script src="dashboard.js"></script></body></html>
